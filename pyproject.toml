[project]
name = "analytics-case"
version = "0.1.0"
description = "Reproducible analytics engineering case starter"
requires-python = ">=3.12,<3.13"
dependencies = ["dbt-core>=1.12,<1.13", "dbt-duckdb>=1.9,<2", "duckdb>=1.2,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "sqlfluff>=3.3,<4"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
